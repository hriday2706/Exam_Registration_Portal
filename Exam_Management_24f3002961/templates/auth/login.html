{% extends "base.html" %}

{% block title %}Login - Examination Management Portal{% endblock %}

{% block auth_content %}
<div class="card shadow-sm">
    <div class="card-header bg-white text-center py-3">
        <h4 class="mb-0 fw-bold text-primary">Portal Login</h4>
        <small class="text-muted">Sign in with your credentials</small>
    </div>
    <div class="card-body p-4">
        <form method="POST" action="{{ url_for('login') }}">
            <div class="mb-3">
                <label for="login_identifier" class="form-label fw-semibold">Username or Email</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                    <input type="text" class="form-control" id="login_identifier" name="login_identifier" placeholder="Enter username or email" required autofocus>
                </div>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label fw-semibold">Password</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                    <input type="password" class="form-control" id="password" name="password" placeholder="Enter password" required>
                </div>
            </div>

            <div class="mb-3 form-check">
                <input type="checkbox" class="form-check-input" id="remember" name="remember">
                <label class="form-check-label text-muted" for="remember">Remember me</label>
            </div>

            <div class="d-grid mb-3">
                <button type="submit" class="btn btn-primary py-2 fw-semibold">
                    <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
                </button>
            </div>
        </form>
    </div>
    <div class="card-footer bg-light text-center py-3">
        <span class="text-muted">New user? </span>
        <a href="{{ url_for('register') }}" class="text-decoration-none fw-semibold">Register here</a>
    </div>
</div>
{% endblock %}
