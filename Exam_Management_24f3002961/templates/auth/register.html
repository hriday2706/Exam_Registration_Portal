{% extends "base.html" %}

{% block title %}Register - Examination Management Portal{% endblock %}

{% block auth_content %}
<div class="card shadow-sm">
    <div class="card-header bg-white text-center py-3">
        <h4 class="mb-0 fw-bold text-primary">Create an Account</h4>
        <small class="text-muted">Register as a Student or Examiner</small>
    </div>
    <div class="card-body p-4">
        <form method="POST" action="{{ url_for('register') }}">
            <div class="mb-3">
                <label for="role" class="form-label fw-semibold">Account Type</label>
                <select class="form-select" id="role" name="role" required>
                    <option value="student" selected>Student</option>
                    <option value="examiner">Examiner (Requires Admin Approval)</option>
                </select>
            </div>

            <div class="mb-3">
                <label for="name" class="form-label fw-semibold">Full Name</label>
                <input type="text" class="form-control" id="name" name="name" placeholder="e.g. John Doe" required>
            </div>

            <div class="mb-3">
                <label for="username" class="form-label fw-semibold">Username</label>
                <input type="text" class="form-control" id="username" name="username" placeholder="Choose a unique username" required>
            </div>

            <div class="mb-3">
                <label for="email" class="form-label fw-semibold">Email Address</label>
                <input type="email" class="form-control" id="email" name="email" placeholder="name@domain.com" required>
            </div>

            <div class="mb-3">
                <label for="phone" class="form-label fw-semibold">Phone Number</label>
                <input type="text" class="form-control" id="phone" name="phone" placeholder="Optional contact number">
            </div>

            <div class="mb-3">
                <label for="department" class="form-label fw-semibold">Department (For Examiners)</label>
                <input type="text" class="form-control" id="department" name="department" placeholder="e.g. Computer Science">
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="password" class="form-label fw-semibold">Password</label>
                    <input type="password" class="form-control" id="password" name="password" placeholder="At least 6 characters" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label for="confirm_password" class="form-label fw-semibold">Confirm Password</label>
                    <input type="password" class="form-control" id="confirm_password" name="confirm_password" placeholder="Re-enter password" required>
                </div>
            </div>

            <div class="d-grid mb-3">
                <button type="submit" class="btn btn-primary py-2 fw-semibold">
                    <i class="bi bi-person-plus me-1"></i> Register
                </button>
            </div>
        </form>
    </div>
    <div class="card-footer bg-light text-center py-3">
        <span class="text-muted">Already have an account? </span>
        <a href="{{ url_for('login') }}" class="text-decoration-none fw-semibold">Sign in here</a>
    </div>
</div>
{% endblock %}
