{% extends "base.html" %}

{% block title %}{{ action }} Examination - Examination Management Portal{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-9 col-lg-8">
        <div class="card shadow-sm">
            <div class="card-header bg-white py-3">
                <h5 class="mb-0 fw-bold">{{ action }} Examination</h5>
            </div>
            <div class="card-body p-4">
                <form method="POST">
                    <div class="row">
                        <div class="col-md-8 mb-3">
                            <label for="name" class="form-label fw-semibold">Examination Name</label>
                            <input type="text" class="form-control" id="name" name="name" value="{{ exam.name if exam else '' }}" placeholder="e.g. CS101 Practical Exam" required>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label for="course_id" class="form-label fw-semibold">Course</label>
                            <select class="form-select" id="course_id" name="course_id" required>
                                <option value="">Select Course</option>
                                {% for c in courses %}
                                <option value="{{ c.id }}" {% if exam and exam.course_id == c.id %}selected{% endif %}>{{ c.course_code }} - {{ c.course_name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label for="exam_type" class="form-label fw-semibold">Examination Type</label>
                            <select class="form-select" id="exam_type" name="exam_type">
                                <option value="Viva" {% if exam and exam.exam_type == 'Viva' %}selected{% endif %}>Viva</option>
                                <option value="Practical" {% if exam and exam.exam_type == 'Practical' %}selected{% endif %}>Practical</option>
                                <option value="Project Demo" {% if exam and exam.exam_type == 'Project Demo' %}selected{% endif %}>Project Demo</option>
                                <option value="Assessment" {% if exam and exam.exam_type == 'Assessment' %}selected{% endif %}>Assessment</option>
                            </select>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label for="duration" class="form-label fw-semibold">Duration (Minutes)</label>
                            <input type="number" class="form-control" id="duration" name="duration" value="{{ exam.duration if exam else 30 }}" min="5" max="300" required>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label for="max_marks" class="form-label fw-semibold">Maximum Marks</label>
                            <input type="number" class="form-control" id="max_marks" name="max_marks" value="{{ exam.max_marks if exam else 100 }}" min="1" max="1000" required>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="slot_creation_start_date" class="form-label fw-semibold">Slot Creation Start Date</label>
                            <input type="date" class="form-control" id="slot_creation_start_date" name="slot_creation_start_date" value="{{ exam.slot_creation_start_date.strftime('%Y-%m-%d') if exam else '' }}" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="slot_creation_end_date" class="form-label fw-semibold">Slot Creation End Date</label>
                            <input type="date" class="form-control" id="slot_creation_end_date" name="slot_creation_end_date" value="{{ exam.slot_creation_end_date.strftime('%Y-%m-%d') if exam else '' }}" required>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="slot_booking_start_date" class="form-label fw-semibold">Slot Booking Start Date</label>
                            <input type="date" class="form-control" id="slot_booking_start_date" name="slot_booking_start_date" value="{{ exam.slot_booking_start_date.strftime('%Y-%m-%d') if exam else '' }}" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="slot_booking_end_date" class="form-label fw-semibold">Slot Booking End Date</label>
                            <input type="date" class="form-control" id="slot_booking_end_date" name="slot_booking_end_date" value="{{ exam.slot_booking_end_date.strftime('%Y-%m-%d') if exam else '' }}" required>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="status" class="form-label fw-semibold">Status</label>
                        <select class="form-select" id="status" name="status">
                            <option value="Draft" {% if exam and exam.status == 'Draft' %}selected{% endif %}>Draft</option>
                            <option value="Slot Creation" {% if exam and exam.status == 'Slot Creation' %}selected{% endif %}>Slot Creation</option>
                            <option value="Booking Open" {% if exam and exam.status == 'Booking Open' %}selected{% endif %}>Booking Open</option>
                            <option value="Closed" {% if exam and exam.status == 'Closed' %}selected{% endif %}>Closed</option>
                            <option value="Completed" {% if exam and exam.status == 'Completed' %}selected{% endif %}>Completed</option>
                        </select>
                    </div>

                    <div class="d-flex justify-content-between">
                        <a href="{{ url_for('admin_examinations') }}" class="btn btn-outline-secondary">Cancel</a>
                        <button type="submit" class="btn btn-primary px-4">
                            <i class="bi bi-check-circle me-1"></i> Save Examination
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
