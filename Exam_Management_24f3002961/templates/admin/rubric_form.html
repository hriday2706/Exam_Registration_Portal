{% extends "base.html" %}

{% block title %}{{ action }} Rubric Criterion - Examination Management Portal{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card shadow-sm">
            <div class="card-header bg-white py-3">
                <h5 class="mb-0 fw-bold">{{ action }} Rubric Criterion for {{ exam.name }}</h5>
            </div>
            <div class="card-body p-4">
                <form method="POST">
                    <div class="mb-3">
                        <label for="criterion_name" class="form-label fw-semibold">Criterion Name</label>
                        <input type="text" class="form-control" id="criterion_name" name="criterion_name" value="{{ rubric.criterion_name if rubric else '' }}" placeholder="e.g. Code Implementation & Logic" required>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="max_marks" class="form-label fw-semibold">Maximum Marks</label>
                            <input type="number" class="form-control" id="max_marks" name="max_marks" value="{{ rubric.max_marks if rubric else 10 }}" min="1" max="500" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="weightage" class="form-label fw-semibold">Weightage</label>
                            <input type="number" step="0.1" class="form-control" id="weightage" name="weightage" value="{{ rubric.weightage if rubric else 1.0 }}" min="0.1" max="10.0" required>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="description" class="form-label fw-semibold">Description / Guidelines</label>
                        <textarea class="form-control" id="description" name="description" rows="3" placeholder="Guidance for examiners on how to evaluate this criterion">{{ rubric.description if rubric else '' }}</textarea>
                    </div>

                    <div class="d-flex justify-content-between">
                        <a href="{{ url_for('admin_rubrics', exam_id=exam.id) }}" class="btn btn-outline-secondary">Cancel</a>
                        <button type="submit" class="btn btn-primary px-4">
                            <i class="bi bi-check-circle me-1"></i> Save Criterion
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
